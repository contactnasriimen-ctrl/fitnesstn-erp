<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP FitnessTN</title>
<meta name="description" content="ERP FitnessTN : caisse, stock, livraisons, tâches, marketing et finances pour les showrooms de Tunis et Nabeul.">
<link rel="icon" href="app/assets/img/favicon.svg" type="image/svg+xml">
<script type="importmap">
{ "imports": { "@php-wasm/web-8-3": "./vendor/web-8-3/index.js", "wasm-feature-detect": "./vendor/wasm-feature-detect/index.js" } }
</script>
<style>
  :root { --navy: #0a1f4d; --navy-2: #071431; --brand: #1f7bff; --text: #0f172a; --muted: #66738a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--text); background: #f3f5f9; display: flex; flex-direction: column; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #f3f5f9; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(135deg, #071431 0%, #0a1f4d 50%, #0b3fb3 100%); color: #dbe6ff; z-index: 1; transition: opacity .3s; }
  .ready #boot { opacity: 0; pointer-events: none; }
  .boot-card { width: min(440px, calc(100vw - 32px)); text-align: center; }
  .boot-card img { width: 76px; height: 76px; }
  .boot-card h1 { color: #fff; font-size: 26px; margin: 10px 0 4px; }
  .boot-card p { margin: 0 0 18px; color: #b9c9ea; }
  .track { height: 6px; background: rgba(255, 255, 255, .15); border-radius: 999px; overflow: hidden; }
  #boot-bar { height: 100%; width: 3%; background: #46c2ff; border-radius: 999px; transition: width .4s; }
  #boot-text { margin-top: 12px; font-size: 13px; color: #c9d6f2; min-height: 1.4em; }
  #boot.error #boot-text { color: #ffb4b4; font-weight: 600; }
  .note { margin-top: 22px; font-size: 12px; color: #8ea6d2; }
</style>
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <img src="app/assets/img/logo-fitnesstn-white.svg" alt="" style="width:300px;height:auto">
      <h1>ERP FitnessTN</h1>
      <p>Caisse · Devis & factures · Stock · Livraisons · Tâches · Finances</p>
      <div class="track"><div id="boot-bar"></div></div>
      <div id="boot-text">Chargement…</div>
      <div class="note">L’ERP fonctionne entièrement dans votre navigateur : vos données restent sur cet appareil.<br>Le premier chargement peut prendre quelques secondes.</div>
    </div>
  </div>
  <iframe id="erp" title="ERP FitnessTN"></iframe>
  <script type="module" src="./host.js"></script>
</body>
</html>
